name: Check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - run: npm run build
      - run: npm test
      - name: Native browser fetch and standalone app smoke test
        run: node scripts/browser-smoke.mjs
      - run: git diff --exit-code -- dist/Velocity.html
